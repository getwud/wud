version: '3.8'

services:
  web:
    image: nginx:1.27.0
    deploy:
      replicas: 1
      labels:
        - "getwud.app/display.name=Swarm Nginx Web"
        - "getwud.app/tag.include=^1\\.27"

  redis:
    image: redis:7.2.0
    deploy:
      replicas: 1
      labels:
        - "getwud.app/display.name=Swarm Redis Cache"
