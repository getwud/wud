apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-cronjob
  namespace: default
  annotations:
    wud.getwud.io/watch: "true"
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron-app
              image: alpine:3.20
              command: ["echo", "hello"]
