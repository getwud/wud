name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 24
  IMAGE_NAME: wud
  DOCKER_PLATFORMS: linux/arm64/v8,linux/amd64

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            ui/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd ui && npm ci)
          (cd e2e && npm ci)
      - name: Run lint
        run: |
          (cd app && npm run lint)
          (cd ui && npm run lint)
          (cd e2e && npm run lint)

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            ui/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd ui && npm ci)
      - name: Run unit tests
        run: |
          (cd app && npm test)
          (cd ui && npm run test:unit)

  e2e-test:
    name: E2E Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    env:
      GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd e2e && npm ci)
      - name: Build UI
        run: (cd ui && npm run build)
      - name: Build Docker Image
        run: docker build -t wud --build-arg WUD_VERSION=test .
      - name: Setup test containers
        run: (cd scripts && ./setup-test-containers.sh)
      - name: Start wud
        run: (cd scripts && ./start-wud.sh)
      - name: Show wud logs
        run: docker logs wud || true
      - name: Run E2E Tests
        run: (cd e2e && npm run cucumber)

  publish:
    name: Publish Docker Image
    needs: [lint, unit-test, e2e-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WUD_VERSION=${{ steps.meta.outputs.version }}
