name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: 24
  IMAGE_NAME: wud
  DOCKER_PLATFORMS: linux/arm64/v8,linux/amd64

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            ui/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd ui && npm ci)
          (cd e2e && npm ci)
      - name: Run lint
        run: |
          (cd app && npm run lint)
          (cd ui && npm run lint)
          (cd e2e && npm run lint)

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            ui/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd ui && npm ci)
      - name: Run unit tests
        run: |
          (cd app && npm test)
          (cd ui && npm run test:unit)

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: (cd website && npm ci)
      - name: Build website
        run: (cd website && npm run build)
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: website/build
          retention-days: 1

  e2e-test:
    name: E2E Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    env:
      GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd e2e && npm ci)
      - name: Run E2E Tests
        run: ./scripts/run-e2e-tests.sh
      - name: Show wud logs on failure
        if: failure()
        run: docker logs wud || true

  ui-e2e-test:
    name: UI E2E Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            ui-e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd ui-e2e && npm ci)
      - name: Run UI E2E Tests
        run: ./scripts/run-ui-tests.sh
      - name: Show wud logs on failure
        if: failure()
        run: docker logs wud || true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-e2e/playwright-report/
          retention-days: 7

  publish:
    name: Publish Docker Image
    needs: [lint, unit-test, e2e-test, ui-e2e-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WUD_VERSION=${{ steps.meta.outputs.version }}

  deploy-docs:
    name: Deploy Docs
    needs: [build-docs, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: website/build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
